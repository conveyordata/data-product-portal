version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/cli/golang"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
      vite:
        patterns:
          - "vite"
          - "vite-plugin-*"
          - "@vitejs/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      types:
        patterns:
          - "@types/*"
      aws-sdk-js:
        patterns:
          - "@aws-sdk/*"
      antd:
        patterns:
          - "antd"
          - "@ant-design/*"
      testing:
        patterns:
          - "vitest"
          - "@testing-library/*"
          - "jsdom"
          - "msw"
          - "cypress"
      lint-and-build:
        patterns:
          - "@biomejs/biome"
          - "knip"
          - "typescript"
          - "sass"
          - "esbuild"
          - "patch-package"
          - "rollup-plugin-visualizer"
      redux:
        patterns:
          - "@reduxjs/toolkit"
          - "react-redux"
          - "@rtk-query/codegen-openapi"
      graph-layout:
        patterns:
          - "@xyflow/react"
          - "@dagrejs/dagre"
          - "elkjs"

  - package-ecosystem: "npm"
    directory: "/docs"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react"
          - "react-dom"

  - package-ecosystem: "pip"
    directories:
      - "/backend"
      - "/plugins"
      - "/tools/poetry"
      - "/.github"
      - "/demo/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      pydantic:
        patterns:
          - "pydantic"
          - "pydantic-settings"
      database:
        patterns:
          - "sqlalchemy"
          - "sqlalchemy-*"
          - "alembic"
          - "psycopg"
          - "psycopg-*"
          - "asyncpg"
          - "pgvector"
          - "greenlet"
          - "casbin_sqlalchemy_adapter"
      python-dev-tooling:
        dependency-type: "development"
      per-dependency:
        group-by: dependency-name

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/demo/**/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      per-image:
        group-by: dependency-name

  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 10
    groups:
      actions-deps:
        patterns:
          - "*"
    ignore:
      - dependency-name: "abatilo/actions-poetry"
        versions: [ "4.0.0" ]
      - dependency-name: "github/gh-aw-actions/*"
