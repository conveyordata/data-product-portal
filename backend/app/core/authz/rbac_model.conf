[request_definition]
r = sub, dom, obj, parent, act

[policy_definition]
p = sub, act

[role_definition]
g = _, _, _ ; resource roles
g2 = _, _, _ ; domain roles
g3 = _, _ ; global roles
g4 = _, _, _ ; consumer, producer data product, producer output port

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g3(r.sub, "*") || (r.act == p.act && ( \
    p.sub == "*" \
    || g(r.sub, p.sub, r.obj) \
    || g("*", p.sub, r.obj) \
    || g("*", p.sub, r.parent) \
    || g(r.sub, p.sub, r.parent) \
    || g2(r.sub, p.sub, r.dom) \
    || g3(r.sub, p.sub) \
    || hasAccessThroughConsumerRole(r.sub, p.sub, r.obj, r.parent, r.act) \
))
