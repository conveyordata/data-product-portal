pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
pytest-dotenv= "^0.5.2"
factory-boy = "^3.3.3"
freezegun = "^1.5.5"
data-product-portal-sdk = { path = "../sdk", develop = true }
pytest-xdist = "^3.8.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = ">=2.3.1"
types-cachetools = "*"
types-requests = "*"
types-PyYAML = "*"
