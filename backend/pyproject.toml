cachetools = ">=8.0.2,<9.0.0"
greenlet = "^3.5.5"
h11 = "^0.16.0"
fastmcp = "4.2.4"
posthog = "^8.1.0"
authlib = "1.9.10"
fastembed = ">=0.8,<0.10"
pgvector = "^0.5.0"
opentelemetry-api = "^1.45.2"
opentelemetry-sdk = "^1.45.2"
opentelemetry-exporter-otlp = "^1.45.2"
opentelemetry-instrumentation-fastapi = "^0.66b2"
opentelemetry-instrumentation-sqlalchemy = "^0.66b2"
opentelemetry-distro = "^0.66b2"
pycasbin = "^2.8.0"
azure-identity = "^1.27.0"

[tool.poetry.group.plugins.dependencies]
data-product-portal-plugins = { path = "../plugins", develop = true }

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
