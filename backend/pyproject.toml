requests = "^2.34.2"
httpx = "^0.28.1"
alembic = "^1.20.0"
sqlalchemy = { version = "^2.1.9", extras = ['asyncio'] }
sqlalchemy-utils = ">=0.42.1,<0.44.0"
sqlalchemy-easy-softdelete = ">=0.9.1,<2.1.0"
psycopg = { version = "^3.3.0", extras = ["binary"] }
pyyaml = "^6.0.3"
pyjwt = "^2.14.0"
shortuuid = "^1.0.13"
boto3 = "^1.44.9"
jinja2 = "^3.1.6"
asgi-correlation-id = "^5.0.1"
cryptography = "^50.0.1"
emailgen = "^0.1.1"
casbin_sqlalchemy_adapter = "^1.4.0"
