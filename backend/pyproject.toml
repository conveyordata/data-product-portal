[tool.ruff.lint]
#https://docs.astral.sh/ruff/rules/
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "FAST001", "FAST002", "FAST003",
    "YTT", #flake-2020 rules, check for YTT bugs
    "ASYNC", #flake8 async rules
    "S", #flake-8 bandit, security rules
    "PT", #flake-8 pytest style
    "SIM", #flake-8 simplify rules
    "C4", #flake-8 comprehensions, help with writing better list/set/dict comprehensions.
    "EXE", #flake8-executable
    "FIX", #flake8-fixme
    "ISC", #flake8-implicit-str-concat
    "RSE", #flake8-raise
    "T20", #flake-8 print
    "TC", #flake8-type-checking
    "TID251", #flake8-tidy-imports banned-api
    "TID252", #flake8-tidy-imports relative-imports
    "FURB",
    "PERF",
    "FLY",
]
ignore = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "pydantic_settings.BaseSettings",
    "app.shared.schema.ORMModel",
    "app.database.database.Base",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S311"]
"tests/__init__.py" = ["TID251", "E402"]
"tests/factories/**" = ["TID251"]
"app/database/alembic/versions/*.py" = ["TID251"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"starlette.status".msg = "Use `from fastapi import status` instead."
"tests.test_session".msg = "Use the `session` fixture instead of importing test_session directly."
"sqlalchemy.text".msg = "Do not import `text` from SQLAlchemy; use SQLAlchemy expressions/ORM APIs instead. This is a security issue, since raw sqls bypass hidden data product and private output port visibility"
