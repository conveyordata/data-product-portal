[pytest]
env_override_existing_values = 1
env_files = .test.env
addopts = -p no:warnings --import-mode=importlib --durations=0 --durations-min=1.0
markers =
    commits: commits for real instead of rolling back, the tables are cleared afterwards
    seeds_casbin: writes Casbin rules without the database rows they stand for, so skips the check that Casbin matches the database
