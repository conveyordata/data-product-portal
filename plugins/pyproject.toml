[project]
name = "data-product-portal-plugins"
version = "0.7.4"
description = "First-party technical asset plugins for Data Product Portal"
requires-python = ">=3.13"
dependencies = [
    "data-product-portal>=0.7.4",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "alembic>=1.20.0",
    "boto3>=1.43.93",
    "fastmcp>=3.4.7",
]

[project.entry-points."data_product_portal.plugins"]
glue = "portal_plugins.glue.schema:GlueTechnicalAssetConfiguration"

[tool.poetry]
packages = [{ include = "portal_plugins", from = "." }]

[tool.poetry.dependencies]
python = "^3.13"

[tool.mypy]
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/../backend"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
