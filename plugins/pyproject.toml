[project]
name = "data-product-portal-plugins"
version = "0.8.0"
description = "First-party technical asset plugins for Data Product Portal"
requires-python = ">=3.13"
dependencies = [
    "data-product-portal>=0.8.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
    "alembic>=1.20.0",
    "boto3>=1.43.93",
    "fastmcp>=3.4.7",
]

[project.entry-points."data_product_portal.platforms"]
agno = "portal_plugins.platforms:AgnoPlatform"
aws = "portal_plugins.platforms:AWSPlatform"
azure = "portal_plugins.platforms:AzurePlatform"
conveyor = "portal_plugins.platforms:ConveyorPlatform"
databricks = "portal_plugins.platforms:DatabricksPlatform"
github = "portal_plugins.platforms:GitHubPlatform"
osi = "portal_plugins.platforms:OSIPlatform"
postgresql = "portal_plugins.platforms:PostgreSQLPlatform"
snowflake = "portal_plugins.platforms:SnowflakePlatform"

[tool.poetry]
packages = [{ include = "portal_plugins", from = "." }]

[tool.poetry.dependencies]
python = "^3.13"

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/../backend"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
