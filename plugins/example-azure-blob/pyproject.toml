[project]
name = "example-azure-blob"
version = "0.2.0"
description = "Example third-party technical asset plugin for the Data Product Portal: Azure Blob Storage."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0",
    "data-product-portal-sdk",
]

# This is the whole discovery mechanism: an entry point in the
# "data_product_portal.plugins" group, pointing at the plugin class.
# The portal never has to know this package exists ahead of time.
[project.entry-points."data_product_portal.plugins"]
azure-blob = "example_azure_blob.plugin:AzureBlobPlugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_azure_blob"]

[tool.hatch.build.targets.wheel.force-include]
"src/example_azure_blob/icon.svg" = "example_azure_blob/icon.svg"
