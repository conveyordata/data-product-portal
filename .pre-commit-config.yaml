repos:
# Common git hooks
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
    # Git style
    - id: check-added-large-files
      exclude: ^frontend/src/assets/fonts/
    - id: check-merge-conflict
    - id: no-commit-to-branch

    # Common errors
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-yaml
      exclude: ^(helm/templates|demo/basic/provisioner/templates/dbt)
    - id: check-merge-conflict
    - id: check-executables-have-shebangs

    # Cross-platform
    - id: check-case-conflict
    - id: mixed-line-ending
      args: [--fix=lf]
    - id: check-symlinks

    # Security
    - id: detect-aws-credentials
      args: ['--allow-missing-credentials']
    - id: detect-private-key

# Python
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.18
  hooks:
    - id: ruff-check
      args: [ --fix, --unsafe-fixes]
    - id: ruff-format
- repo: https://github.com/sqlfluff/sqlfluff
  rev: 3.5.0
  hooks:
    - id: sqlfluff-fix
      args: [--config, .sqlfluff]
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.27.2
  hooks:
    - id: gitleaks
# Splitting up the mypy checks as monorepos are not well supported:
# https://github.com/python/mypy/issues/4008
- repo: local
  hooks:
    - id: mypy-backend
      name: mypy (backend)
      entry: ./scripts/mypy.sh --config-file=backend/pyproject.toml
      language: script
      types_or: [python, pyi]
      files: ^backend/
      require_serial: true
    - id: mypy-plugins
      name: mypy (plugins)
      entry: ./scripts/mypy.sh --config-file=plugins/pyproject.toml
      language: script
      types_or: [python, pyi]
      files: ^plugins/
      require_serial: true
    - id: mypy-sdk
      name: mypy (sdk)
      entry: ./scripts/mypy.sh --config-file=sdk/pyproject.toml
      language: script
      types_or: [python, pyi]
      files: ^sdk/
      exclude: ^sdk/sdk/api_client/
      require_serial: true
    - id: add-helm-version
      name: add-helm-version
      entry: ./scripts/add_helm_version.sh
      language: script
      pass_filenames: false
    - id: check-python-version
      name: Check Python version pins match the backend
      entry: ./scripts/check_python_version.sh
      language: script
      files: ^(backend/pyproject\.toml|backend/\.python-version|plugins/pyproject\.toml|Dockerfile|scripts/check_python_version\.sh)$
      pass_filenames: false
    - id: regen-openapi-spec
      name: Regen openapi spec
      entry: ./scripts/check_openapi_spec.sh
      language: script
      types: [text]
      files: ^backend\/.*\.py$
      pass_filenames: false
    - id: check-generated-api
      name: Check generated API is up to date
      entry: ./scripts/check_generated_api.sh
      language: script
      types: [text]
      files: ^docs/static/openapi.json$
      pass_filenames: false
    - id: check-generated-sdk
      name: Check generated SDK is up to date
      entry: ./scripts/check_generated_sdk.sh
      language: script
      types: [text]
      files: ^docs/static/openapi.json$
      pass_filenames: false
    - id: check-generated-plugin-configurations
      name: Check generated SDK plugin configurations are up to date
      entry: ./scripts/check_generated_plugin_configurations.sh
      language: script
      types: [text]
      files: ^(backend/app/technical_asset_configuration|plugins/portal_plugins)/.*/(schema|model)\.py$
      pass_filenames: false
    - id: check-generated-cli
      name: Check generated CLI is up to date
      entry: ./scripts/check_generated_cli.sh
      language: script
      types: [text]
      files: ^docs/static/openapi.json$
      pass_filenames: false
    - id: validate-api-errors
      name: Validate API error constants against OpenAPI
      entry: bash -c "cd frontend && npm run validate-api-errors"
      language: system
      types: [text]
      files: ^(frontend/src/store/common/api-errors\.ts|docs/static/openapi\.json)$
      pass_filenames: false
    - id: local-fe-check
      name: fe check
      entry: bash -c "cd frontend && npm run biome:fix"
      language: system
      types: [text]
      files: "\\.(jsx?|tsx?|c(js|ts)|m(js|ts)|d\\.(ts|cts|mts)|jsonc?|css|svelte|vue|astro|graphql|gql)$"
      exclude: ^docs/
      pass_filenames: false
    - id: no-commit
      name: Prevent .commit() in backend tests, routers and services
      entry: '\.commit\((?![^\n]*#\s*allow-commit)'
      language: pygrep
      types: [python]
      files: ^(backend/tests/|backend/app/.*/service\.py|backend/app/.*/router\.py$)
